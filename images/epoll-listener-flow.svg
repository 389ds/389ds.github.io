<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 900" width="790" height="900" font-family="Helvetica, Arial, sans-serif">
<rect width="790" height="900" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6573"/></marker></defs>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#1d232b">epoll listener (#7983): the life of a request</text>
<text x="20" y="48" font-size="12" fill="#5a6573">Function names from #7983: d = daemon.c, c = connection.c, t = conntable.c</text>
<rect x="30" y="70" width="330" height="135" rx="6" fill="#ffffff" stroke="#8a94a1" stroke-width="1.6"/>
<path d="M36,70 H354 Q360,70 360,76 V92 H30 V76 Q30,70 36,70 Z" fill="#8a94a1"/>
<text x="40" y="85.5" font-size="12.5" font-weight="bold" fill="#ffffff">1  Accept (listener thread)</text>
<text x="40" y="108" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">d: accept_thread()</tspan></text>
<text x="40" y="123" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">d: handle_new_connection()</tspan></text>
<text x="40" y="138" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">t: connection_table_move_</tspan></text>
<text x="40" y="153" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">   connection_on_to_active_list()</tspan></text>
<text x="40" y="168" fill="#1d232b"><tspan font-size="11.5">puts it on connection table list i</tspan></text>
<text x="40" y="183" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">d: connection_epoll_register_nolock()</tspan></text>
<text x="40" y="198" fill="#1d232b"><tspan font-size="11.5">adds the socket to list i, one-shot</tspan></text>
<rect x="30" y="239" width="330" height="75" rx="6" fill="#ffffff" stroke="#5b5fa8" stroke-width="1.6"/>
<path d="M36,239 H354 Q360,239 360,245 V261 H30 V245 Q30,239 36,239 Z" fill="#5b5fa8"/>
<text x="40" y="254.5" font-size="12.5" font-weight="bold" fill="#ffffff">2  Connection table list i</text>
<text x="40" y="277" fill="#1d232b"><tspan font-size="11.5">epoll set: the connections&#x27; sockets,</tspan></text>
<text x="40" y="292" fill="#1d232b"><tspan font-size="11.5">each reported once, then disarmed</tspan></text>
<text x="40" y="307" fill="#1d232b"><tspan font-size="11.5">one list thread waits on it</tspan></text>
<rect x="30" y="348" width="330" height="75" rx="6" fill="#ffffff" stroke="#0f6b72" stroke-width="1.6"/>
<path d="M36,348 H354 Q360,348 360,354 V370 H30 V354 Q30,348 36,348 Z" fill="#0f6b72"/>
<text x="40" y="363.5" font-size="12.5" font-weight="bold" fill="#ffffff">3  The list thread wakes</text>
<text x="40" y="386" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">d: ct_list_thread()</tspan><tspan font-size="11.5">: epoll_wait() for</tspan></text>
<text x="40" y="401" fill="#1d232b"><tspan font-size="11.5">at most 4 events per worker (min 16)</tspan></text>
<text x="40" y="416" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">d: handle_epoll_read_ready()</tspan></text>
<rect x="30" y="457" width="330" height="120" rx="6" fill="#ffffff" stroke="#0f6b72" stroke-width="1.6"/>
<path d="M36,457 H354 Q360,457 360,463 V479 H30 V463 Q30,457 36,457 Z" fill="#0f6b72"/>
<text x="40" y="472.5" font-size="12.5" font-weight="bold" fill="#ffffff">4  Checks, then queue it</text>
<text x="40" y="495" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">d: handle_epoll_conn_event()</tspan></text>
<text x="40" y="510" fill="#1d232b"><tspan font-size="11.5">trylock: if busy, retry next pass</tspan></text>
<text x="40" y="525" fill="#1d232b"><tspan font-size="11.5">checks: stale, closing, already</tspan></text>
<text x="40" y="540" fill="#1d232b"><tspan font-size="11.5">owned, max threads per connection</tspan></text>
<text x="40" y="555" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">c: connection_activity()</tspan></text>
<text x="40" y="570" fill="#1d232b"><tspan font-size="11.5">puts it on the work queue</tspan></text>
<rect x="30" y="611" width="330" height="90" rx="6" fill="#ffffff" stroke="#a3367a" stroke-width="1.6"/>
<path d="M36,611 H354 Q360,611 360,617 V633 H30 V617 Q30,611 36,611 Z" fill="#a3367a"/>
<text x="40" y="626.5" font-size="12.5" font-weight="bold" fill="#ffffff">5  A worker runs it</text>
<text x="40" y="649" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">c: connection_threadmain()</tspan></text>
<text x="40" y="664" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">c: connection_wait_for_new_work()</tspan></text>
<text x="40" y="679" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">c: connection_read_operation()</tspan></text>
<text x="40" y="694" fill="#1d232b"><tspan font-size="11.5">then the operation runs</tspan></text>
<rect x="30" y="735" width="330" height="45" rx="6" fill="#ffffff" stroke="#a3367a" stroke-width="1.6"/>
<path d="M36,735 H354 Q360,735 360,741 V757 H30 V741 Q30,735 36,735 Z" fill="#a3367a"/>
<text x="40" y="750.5" font-size="12.5" font-weight="bold" fill="#ffffff">6  Operation done: what next?</text>
<text x="40" y="773" fill="#1d232b"><tspan font-size="11.5">one of three outcomes (right)</tspan></text>
<path d="M 195.0 205 L 195.0 239" fill="none" stroke="#5a6573" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M 195.0 314 L 195.0 348" fill="none" stroke="#5a6573" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M 195.0 423 L 195.0 457" fill="none" stroke="#5a6573" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M 195.0 577 L 195.0 611" fill="none" stroke="#5a6573" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M 195.0 701 L 195.0 735" fill="none" stroke="#5a6573" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="450" y="447" width="300" height="90" rx="6" fill="#ffffff" stroke="#8a94a1" stroke-width="1.6"/>
<path d="M456,447 H744 Q750,447 750,453 V469 H450 V453 Q450,447 456,447 Z" fill="#8a94a1"/>
<text x="460" y="462.5" font-size="12.5" font-weight="bold" fill="#ffffff">A  Nothing more buffered</text>
<text x="460" y="485" fill="#1d232b"><tspan font-size="11.5">re-arm the socket, outside c_mutex:</tspan></text>
<text x="460" y="500" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">c: connection_make_readable_</tspan></text>
<text x="460" y="515" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">   defer_rearm_nolock()</tspan></text>
<text x="460" y="530" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">d: connection_epoll_rearm_unlocked()</tspan></text>
<rect x="450" y="577" width="300" height="90" rx="6" fill="#ffffff" stroke="#8a94a1" stroke-width="1.6"/>
<path d="M456,577 H744 Q750,577 750,583 V599 H450 V583 Q450,577 456,577 Z" fill="#8a94a1"/>
<text x="460" y="592.5" font-size="12.5" font-weight="bold" fill="#ffffff">B  More requests buffered</text>
<text x="460" y="615" fill="#1d232b"><tspan font-size="11.5">or TLS data held by NSS</tspan></text>
<text x="460" y="630" fill="#1d232b"><tspan font-size="11.5">(</tspan><tspan font-family="Menlo, Consolas, monospace" font-size="11">SSL_DataPending()</tspan><tspan font-size="11.5">): queued again</tspan></text>
<text x="460" y="645" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">c: connection_activity()</tspan><tspan font-size="11.5">,</tspan></text>
<text x="460" y="660" fill="#1d232b"><tspan font-size="11.5">no socket event needed</tspan></text>
<rect x="450" y="707" width="300" height="90" rx="6" fill="#ffffff" stroke="#8a94a1" stroke-width="1.6"/>
<path d="M456,707 H744 Q750,707 750,713 V729 H450 V713 Q450,707 456,707 Z" fill="#8a94a1"/>
<text x="460" y="722.5" font-size="12.5" font-weight="bold" fill="#ffffff">C  Turbo (below 2,048 conns)</text>
<text x="460" y="745" fill="#1d232b"><tspan font-size="11.5">a busy connection keeps its worker,</tspan></text>
<text x="460" y="760" fill="#1d232b"><tspan font-size="11.5">which reads its next request;</tspan></text>
<text x="460" y="775" fill="#1d232b"><tspan font-size="11.5">above 2,048 active connections</tspan></text>
<text x="460" y="790" fill="#1d232b"><tspan font-size="11.5">turbo is off (rank scan is O(n2))</tspan></text>
<path d="M 360 761 L 405 761 L 405 477 L 450 477" fill="none" stroke="#5a6573" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M 405 761 L 405 607 L 450 607" fill="none" stroke="#5a6573" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M 405 761 L 405 737 L 450 737" fill="none" stroke="#5a6573" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M 750 492 L 778 492 L 778 265 L 360 265" fill="none" stroke="#5a6573" stroke-width="1.4" marker-end="url(#a)"/>
<text x="368" y="259" font-size="11" fill="#5a6573" text-anchor="start">A: armed again in list i</text>
<path d="M 750 622 L 764 622 L 764 557 L 360 557" fill="none" stroke="#5a6573" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="368" y="551" font-size="11" fill="#5a6573" text-anchor="start">B: back on the work queue</text>
<path d="M 510 797 L 510 860 L 14 860 L 14 651 L 30 651" fill="none" stroke="#5a6573" stroke-width="1.4" marker-end="url(#a)"/>
<text x="516" y="854" font-size="11" fill="#5a6573" text-anchor="start">C: back to 5, same worker</text>
<rect x="450" y="70" width="300" height="120" rx="6" fill="#ffffff" stroke="#8a94a1" stroke-width="1.6"/>
<path d="M456,70 H744 Q750,70 750,76 V92 H450 V76 Q450,70 456,70 Z" fill="#8a94a1"/>
<text x="460" y="85.5" font-size="12.5" font-weight="bold" fill="#ffffff">Also, per list</text>
<text x="460" y="108" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">d: check_active_connections()</tspan></text>
<text x="460" y="123" fill="#1d232b"><tspan font-size="11.5">on a timer: releases closed</tspan></text>
<text x="460" y="138" fill="#1d232b"><tspan font-size="11.5">connections; certificate refresh</tspan></text>
<text x="460" y="153" fill="#1d232b"><tspan font-family="Menlo, Consolas, monospace" font-size="11">d: check_idletimeout()</tspan></text>
<text x="460" y="168" fill="#1d232b"><tspan font-size="11.5">the idle timeout sweep</tspan></text>
<text x="460" y="183" fill="#1d232b"><tspan font-size="11.5">(no per-connection timerfd)</tspan></text>
<text x="20" y="888" font-size="11" fill="#5a6573">A connection is never reported while a worker owns it (EPOLLONESHOT, re-armed when it is handed back).</text>
</svg>